<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ritual</title>

<!-- width=device-width stops the phone pretending it is a desktop.
     viewport-fit=cover lets us paint under the notch; safe-area-inset below keeps text clear of it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- These make "Add to Home Screen" open without Safari's address bar and tabs. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ritual">

<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  :root {
    --bg: #000000;
    --ink: #ffffff;
    --dim: #808080;
    --line: #ffffff;
    --line-soft: #3a3a3a;
    --yellow: #ffff00;
    --red: #ff0000;
    --blue: #0000ff;
    --mono: "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 1.25rem) 1.25rem calc(env(safe-area-inset-bottom) + 1rem);
    text-align: center;
    -webkit-user-select: none;
    user-select: none;
  }

  .sans { font-family: var(--mono); }

  header {
    flex: 0 0 auto;
    font-family: var(--mono);
    color: var(--dim);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    border-bottom: 2px solid var(--line-soft);
    padding-bottom: 0.6rem;
  }

  main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 1.5rem;
    min-height: 0;
    overflow-y: auto;
  }

  /* clamp() scales type with the screen. pre-line keeps the line breaks from the JSON. */
  #text {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(1.35rem, 5.2vw, 2.3rem);
    line-height: 1.35;
    white-space: pre-line;
    margin: 0;
    max-width: 34ch;
    transition: opacity 0.3s linear;
  }
  #text.long { font-size: clamp(1.05rem, 4vw, 1.6rem); }
  #text.fading { opacity: 0; }

  #attribution {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--dim);
    letter-spacing: 0.02em;
    max-width: 32ch;
    line-height: 1.5;
    margin: 0;
    text-transform: uppercase;
    border-top: 1px solid var(--line-soft);
    padding-top: 0.6rem;
  }
  #attribution.unverified { color: #000; background: var(--yellow); border-top: none; padding: 0.3rem 0.6rem; }

  footer { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }

  .verdict { display: flex; gap: 0.75rem; }

  button {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 0;
    padding: 0.75rem 1.25rem;
    cursor: pointer;
    transition: background 0.15s linear, color 0.15s linear, transform 0.1s linear;
  }
  button:active { background: var(--ink); color: #000; transform: translate(2px, 2px); }
  button:disabled { opacity: 0.3; border-color: var(--line-soft); }

  #love.on { background: var(--yellow); border-color: var(--yellow); color: #000; }
  #drop { border-color: var(--red); color: var(--red); }
  #drop:active { background: var(--red); color: #000; }

  .quiet {
    border: none;
    color: var(--dim);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    font-weight: 700;
    padding: 0.4rem 0.6rem;
  }
  .quiet:active { background: transparent; color: var(--ink); transform: none; }

  .row { display: flex; gap: 0.5rem; align-items: center; }
  #back { visibility: hidden; }
  #back.show { visibility: visible; }

  /* ---- Tabs (bottom, hard-edged) ---- */
  #tabbar {
    order: 99;
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    gap: 0;
    padding: 0;
    margin-top: 0.9rem;
    background: var(--bg);
    border-top: 3px solid var(--line);
    border-radius: 0;
    z-index: 100;
  }
  #tabbar button {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.25rem;
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.04em;
    font-weight: 700;
    color: var(--dim);
    background: transparent;
    border: none;
    border-right: 1px solid var(--line-soft);
    border-radius: 0;
    padding: 0.6rem 0.2rem;
  }
  #tabbar button:last-child { border-right: none; }
  #tabbar button svg { width: 1.3rem; height: 1.3rem; display: block; margin: 0 auto; }
  #tabbar button.active { color: #000; background: var(--yellow); }
  #tabbar button:active { background: var(--line-soft); }

  .tab-panel { display: none; flex: 1 1 auto; flex-direction: column; min-height: 0; }
  .tab-panel.active { display: flex; }

  /* ---- Gym ---- */
  .gym-header {
    flex: 0 0 auto;
    font-family: var(--mono);
    color: var(--dim);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    text-align: center;
    border-bottom: 2px solid var(--line-soft);
    padding-bottom: 0.6rem;
  }
  .gym-main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    min-height: 0;
  }
  .gym-photo-wrap {
    position: relative;
    width: 100%;
    max-width: 22rem;
    flex: 1 1 auto;
    min-height: 0;
    border: 3px solid var(--line);
    border-radius: 0;
    overflow: hidden;
    background: #000;
  }
  /* contain, kept clear of the name badge: the floor exercises happen right at the
     bottom edge of the drawing, which cover-cropping or the badge would hide */
  .gym-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding-bottom: 3.3rem;
    display: block;
    filter: grayscale(1) contrast(1.15);
  }
  .gym-timer {
    position: absolute;
    top: 0;
    right: 0;
    font-family: var(--mono);
    font-size: 1.4rem;
    font-weight: 700;
    color: #000;
    background: var(--yellow);
    border-left: 3px solid var(--line);
    border-bottom: 3px solid var(--line);
    border-radius: 0;
    padding: 0.35rem 0.85rem;
    font-variant-numeric: tabular-nums;
  }
  .gym-timer.urgent { color: #fff; background: var(--red); }
  .gym-name-badge {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0.7rem 1rem;
    background: #000;
    border-top: 3px solid var(--line);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-align: center;
  }
  .gym-routines {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    margin-bottom: 0.5rem;
  }
  .gym-routines button {
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    color: var(--dim);
    border: 2px solid var(--line-soft);
    padding: 0.45rem 0.9rem;
    margin: 0 0.2rem;
  }
  .gym-routines button.active { color: #000; border-color: var(--yellow); background: var(--yellow); }
  .gym-cue {
    flex: 0 0 auto;
    margin: 0;
    max-width: 22rem;
    font-size: 0.78rem;
    line-height: 1.4;
    color: var(--ink);
    text-align: left;
  }
  .gym-cue:empty { display: none; }
  .gym-segments {
    flex: 0 0 auto;
    display: flex;
    gap: 2px;
    width: 100%;
    max-width: 22rem;
  }
  .gym-segments .seg {
    flex: 1 1 auto;
    height: 6px;
    border-radius: 0;
    background: var(--line-soft);
    overflow: hidden;
  }
  .gym-segments .seg .fill {
    height: 100%;
    width: 0%;
    background: var(--yellow);
  }
  .gym-segments .seg.done .fill { width: 100%; }
  .gym-next {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .gym-footer { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
  #gym-startpause, #gym-done-restart {
    min-width: 8rem;
    background: var(--yellow);
    color: #000;
    border-color: #000;
    border-width: 2px;
    font-weight: 700;
  }
  #gym-startpause:active, #gym-done-restart:active { background: #000; color: var(--yellow); border-color: var(--yellow); }
  .gym-done {
    display: none;
    position: absolute;
    inset: 0;
    background: #000;
    border-top: 4px solid var(--yellow);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    text-align: center;
    font-family: var(--mono);
    z-index: 200;
  }
  .gym-done.open { display: flex; }
  .gym-done p:first-child { font-size: 1.5rem; color: #000; background: var(--yellow); padding: 0.4rem 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .gym-done p:last-child { color: var(--dim); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; }

  /* ---- Breathing ---- */
  .breath-header {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0;
    border-bottom: 2px solid var(--line-soft);
  }
  .breath-header button {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--dim);
    background: transparent;
    border: 2px solid var(--line-soft);
    border-radius: 0;
    padding: 0.45rem 0.8rem;
    margin: 0.2rem;
  }
  .breath-header button.active { color: #000; border-color: var(--blue); background: var(--blue); }
  .breath-main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.1rem;
    min-height: 0;
  }
  .breath-circle-wrap {
    position: relative;
    width: 100%;
    max-width: 22rem;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1 1 auto;
    min-height: 0;
    container-type: size;
  }
  /* The wrap gets squashed shorter than it is wide on small screens, so a
     percentage size would turn the circle into an oval. cqmin is the wrap's
     shorter side, which keeps it a true circle whatever shape the wrap ends up. */
  .breath-circle {
    position: absolute;
    width: 62cqmin;
    height: 62cqmin;
    border-radius: 50%;
    background: var(--blue);
    border: 3px solid var(--line);
    transform: scale(0.62);
    transition: transform 4s linear;
  }
  .breath-readout { position: relative; text-align: center; z-index: 1; }
  .breath-phase {
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    color: #000;
    background: var(--ink);
    padding: 0.2rem 0.6rem;
    display: inline-block;
  }
  .breath-count {
    font-family: var(--mono);
    font-size: 3rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .breath-phasebar {
    flex: 0 0 auto;
    display: flex;
    gap: 2px;
    width: 100%;
    max-width: 16rem;
  }
  .breath-phasebar .seg {
    flex: 1 1 auto;
    height: 6px;
    border-radius: 0;
    background: var(--line-soft);
    overflow: hidden;
  }
  .breath-phasebar .seg.current { background: #1a1a1a; }
  .breath-phasebar .seg .fill { height: 100%; width: 0%; background: var(--blue); }
  .breath-controls {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .breath-stepper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    font-family: var(--mono);
  }
  .breath-stepper .label { font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--dim); }
  .breath-stepper .row { display: flex; align-items: center; gap: 0.35rem; }
  .breath-stepper button {
    width: 1.9rem; height: 1.9rem; border-radius: 0;
    border: 2px solid var(--line-soft); background: transparent; color: var(--ink);
    font-size: 0.95rem; line-height: 1; padding: 0;
  }
  .breath-stepper .val {
    min-width: 1.6rem; text-align: center; font-size: 0.95rem; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .breath-stepper .val.skip { color: var(--dim); }
  .breath-stats {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 0.74rem;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    text-transform: uppercase;
  }
  .breath-footer { flex: 0 0 auto; display: flex; justify-content: center; gap: 0.6rem; padding-top: 0.4rem; }
  #breath-startpause {
    min-width: 8rem;
    background: var(--blue);
    color: #fff;
    border-color: #000;
    border-width: 2px;
    font-weight: 700;
  }
  #breath-startpause:active { background: #000; color: var(--blue); border-color: var(--blue); }

  /* ---- History ---- */
  /* Top-aligned, not centred like other mains: once the calendars are taller than the screen,
     centring pushes the first one above the scroll area where it can't be reached. */
  .hist-main {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
    gap: 1.25rem;
    padding: 0.4rem 0 0.5rem;
  }
  .hist-section {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    background: #000;
    border: 2px solid var(--line);
    border-radius: 0;
    padding: 1rem;
  }
  .hist-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-family: var(--mono);
  }
  .hist-title .name { font-size: 0.95rem; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: 0.03em; }
  .hist-title .streak { font-size: 0.68rem; letter-spacing: 0.02em; color: var(--dim); text-transform: uppercase; }
  .hist-stats { display: flex; gap: 0.5rem; }
  .hist-stat {
    flex: 1 1 0;
    background: #000;
    border: 1px solid var(--line-soft);
    border-radius: 0;
    padding: 0.55rem 0.3rem;
    text-align: center;
    font-family: var(--mono);
  }
  .hist-stat .n { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); display: block; line-height: 1.2; }
  .hist-stat .l { font-size: 0.56rem; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 700; color: var(--dim); }
  .hist-nav {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding-bottom: 0.6rem;
    border-bottom: 2px solid var(--line-soft);
  }
  .hist-nav .hist-month-label {
    font-family: var(--mono);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink);
    min-width: 10ch;
    text-align: center;
  }
  /* capped and centred: at full screen width the square day cells made each calendar huge */
  .cal-weekdays, .cal-grid { width: 100%; max-width: 13rem; margin: 0 auto; }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    padding-top: 0.2rem;
  }
  .cal-weekdays span {
    font-size: 0.56rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--dim);
    text-align: center;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0;
    background: var(--line-soft);
    color: var(--dim);
    font-family: var(--mono);
    font-size: 0.62rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .cal-cell.empty { background: transparent; }
  .cal-cell.today { box-shadow: inset 0 0 0 1px var(--ink); }
  .cal-cell.taichi-1 { background: #5a5a00; color: var(--ink); }
  .cal-cell.taichi-2 { background: var(--yellow); color: #000; }
  .cal-cell.posture-1 { background: #5a0000; color: var(--ink); }
  .cal-cell.posture-2 { background: var(--red); color: #fff; }
  .cal-cell.breath-1 { background: #00005a; color: var(--ink); }
  .cal-cell.breath-2 { background: var(--blue); color: #fff; }

  /* ---- Manage panel: bottom sheet ---- */
  #panel {
    position: fixed;
    left: 0; right: 0; bottom: 0; top: 8%;
    background: #000;
    display: flex;
    flex-direction: column;
    padding: 0.65rem 1.1rem calc(env(safe-area-inset-bottom) + 1rem);
    text-align: left;
    font-family: var(--mono);
    z-index: 300;
    border-top: 4px solid var(--line);
    border-radius: 0;
    transform: translateY(105%);
    transition: transform 0.28s ease-out;
    pointer-events: none;
  }
  #panel.open { transform: translateY(0); pointer-events: auto; }
  #panel .grabber {
    flex: 0 0 auto;
    width: 2.4rem;
    height: 4px;
    border-radius: 0;
    background: var(--line-soft);
    margin: 0.3rem auto 0.5rem;
  }
  #panel h2 { font-size: 0.76rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin: 1.1rem 0 0.5rem; font-weight: 700; }
  #panel .scroll { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #panel .item { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.55rem 0; border-bottom: 1px solid var(--line-soft); font-size: 0.82rem; line-height: 1.4; color: var(--ink); }
  #panel .item span { flex: 1 1 auto; }
  #panel .item .id { flex: 0 0 auto; color: var(--dim); font-variant-numeric: tabular-nums; }
  #panel .item button { flex: 0 0 auto; font-size: 0.6rem; padding: 0.3rem 0.55rem; letter-spacing: 0.06em; }
  #panel .empty { color: var(--dim); font-size: 0.82rem; padding: 0.5rem 0; text-transform: uppercase; }
  #export { width: 100%; height: 5.5rem; background: #000; color: var(--ink); border: 2px solid var(--line-soft); border-radius: 0; padding: 0.6rem; font-family: var(--mono); font-size: 0.75rem; -webkit-user-select: text; user-select: text; }
  .panel-actions { display: flex; gap: 0.5rem; padding-top: 0.75rem; }
  #copied { color: var(--yellow); font-size: 0.72rem; text-transform: uppercase; font-weight: 700; }
</style>
</head>
<body>

<nav id="tabbar">
  <button id="tab-btn-incantation" class="active">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.5 3.2 1.6 5.6 3.2 7.2 1.6 1.6 4 2.7 7.2 3.2-3.2.5-5.6 1.6-7.2 3.2-1.6 1.6-2.7 4-3.2 7.2-.5-3.2-1.6-5.6-3.2-7.2-1.6-1.6-4-2.7-7.2-3.2 3.2-.5 5.6-1.6 7.2-3.2 1.6-1.6 2.7-4 3.2-7.2z"/></svg>
    <span>Incantation</span>
  </button>
  <button id="tab-btn-gym">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="6" y="7" width="2.5" height="10" rx="1"/><rect x="15.5" y="7" width="2.5" height="10" rx="1"/><rect x="8" y="11" width="8" height="2" rx="1"/></svg>
    <span>Gym</span>
  </button>
  <button id="tab-btn-breathing">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h11a2.5 2.5 0 100-5"/><path d="M3 13h15a2.5 2.5 0 110 5"/><path d="M3 18h8"/></svg>
    <span>Breathing</span>
  </button>
  <button id="tab-btn-history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    <span>History</span>
  </button>
</nav>

<section id="tab-incantation" class="tab-panel active">

<header id="date">&nbsp;</header>

<main>
  <p id="text">Loading…</p>
  <p id="attribution"></p>
</main>

<footer>
  <div class="verdict">
    <button id="love">♡ Love it</button>

<script>
// ===========================================================================
// STATE. Everything lives in one localStorage entry on this device.
//   day     the last date we advanced the rotation on
//   pos     where we are in the file order (this is the "today" position)
//   loved   ids you marked as keepers
//   removed ids you rejected; these are skipped everywhere
// The rotation remembers its position rather than deriving it from the date,
// so editing incantations.json does not move today's line.
// ===========================================================================
const KEY = 'incantation.state.v1';

const blank = { day: null, pos: 0, loved: [], removed: [] };

function load() {
  try {
    return Object.assign({}, blank, JSON.parse(localStorage.getItem(KEY)) || {});
  } catch (e) {
    return Object.assign({}, blank);
  }
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* private mode */ }
}

let state = load();
let all = [];
let view = 0;   // which index is on screen right now

// 'en-CA' formats as YYYY-MM-DD. Local time, so it rolls over at your midnight.
const todayKey = () => new Date().toLocaleDateString('en-CA');

const isRemoved = i => state.removed.includes(all[i].id);
const liveCount = () => all.filter((_, i) => !isRemoved(i)).length;

// Walk forward from `from` to the next line you have not rejected.
function nextLive(from) {
  for (let step = 1; step <= all.length; step++) {
    const i = (from + step) % all.length;
    if (!isRemoved(i)) return i;
  }
  return from;
}

const CATEGORY_LABEL = {
  'incantation':        'Tony Robbins, incantation',
  'primary-question':   'Tony Robbins, his Primary Question',
  'winners-creed':      "The Winner's Creed, Robbins manual, after Napoleon Hill",
  'quote':              'Tony Robbins',
  'event-manual':       null,   // shows the real author instead
  'circulating-online': 'Widely shared, but not traceable to Robbins'
};

function render(i, animate = true) {
  const item = all[i];
  const textEl = document.getElementById('text');
  const attrEl = document.getElementById('attribution');

  const paint = () => {
    view = i;
    textEl.textContent = item.text;
    textEl.classList.toggle('long', item.text.length > 180 || item.text.split('\n').length > 6);
    textEl.classList.remove('fading');

    attrEl.textContent = CATEGORY_LABEL[item.category] || item.attribution;
    attrEl.classList.toggle('unverified', item.category === 'circulating-online');

    document.getElementById('love').classList.toggle('on', state.loved.includes(item.id));
    document.getElementById('back').classList.toggle('show', i !== state.pos);
    refreshCounts();
  };

  if (animate) {
    textEl.classList.add('fading');
    setTimeout(paint, 300);
  } else {
    paint();
  }
}

function refreshCounts() {
  const bits = [];
  if (state.loved.length)   bits.push(state.loved.length + ' loved');
  if (state.removed.length) bits.push(state.removed.length + ' removed');
  bits.push(liveCount() + ' in rotation');
  document.getElementById('open-panel').textContent = bits.join('  ·  ');
}

// ---------------------------------------------------------------------------
// Buttons
// ---------------------------------------------------------------------------
document.getElementById('love').addEventListener('click', () => {
  const id = all[view].id;
  const at = state.loved.indexOf(id);
  if (at === -1) state.loved.push(id); else state.loved.splice(at, 1);
  save();
  document.getElementById('love').classList.toggle('on', state.loved.includes(id));
  refreshCounts();
});

document.getElementById('drop').addEventListener('click', () => {
  if (liveCount() <= 1) return;                      // never empty the rotation
  const id = all[view].id;
  const lovedAt = state.loved.indexOf(id);          // rejecting it also un-loves it
  if (lovedAt !== -1) state.loved.splice(lovedAt, 1);
  if (!state.removed.includes(id)) state.removed.push(id);
  if (view === state.pos) state.pos = nextLive(state.pos);
  if (isRemoved(state.pos)) state.pos = nextLive(state.pos);
  save();
  render(state.pos);
});

document.getElementById('another').addEventListener('click', () => {
  const live = all.map((_, i) => i).filter(i => !isRemoved(i) && i !== view);
  if (!live.length) return;
  render(live[Math.floor(Math.random() * live.length)]);
});

document.getElementById('back').addEventListener('click', () => render(state.pos));

// ---------------------------------------------------------------------------
// Manage panel
// ---------------------------------------------------------------------------
function short(t) { const s = t.replace(/\n/g, ' / '); return s.length > 90 ? s.slice(0, 90) + '…' : s; }

function listInto(el, ids, undoLabel, onUndo) {
  el.innerHTML = '';
  if (!ids.length) {
    const p = document.createElement('div');
    p.className = 'empty';
    p.textContent = 'Nothing yet.';
    el.appendChild(p);
    return;
  }
  ids.forEach(id => {
    const item = all.find(x => x.id === id);
    if (!item) return;
    const row = document.createElement('div');
    row.className = 'item';
    const idEl = document.createElement('b');
    idEl.className = 'id';
    idEl.textContent = id;
    const txt = document.createElement('span');
    txt.textContent = short(item.text);
    const btn = document.createElement('button');
    btn.textContent = undoLabel;
    btn.addEventListener('click', () => { onUndo(id); openPanel(); refreshCounts(); });
    row.append(idEl, txt, btn);
    el.appendChild(row);
  });
}

function exportText() {
  const lines = ['Prune my incantations.json:'];
  lines.push('remove ids: ' + (state.removed.length ? state.removed.join(', ') : '(none)'));
  lines.push('loved ids: '  + (state.loved.length   ? state.loved.join(', ')   : '(none)'));
  return lines.join('\n');
}

function openPanel() {
  document.getElementById('export').value = exportText();
  document.getElementById('removed-head').textContent = 'Removed (' + state.removed.length + ')';
  document.getElementById('loved-head').textContent   = 'Loved (' + state.loved.length + ')';
  listInto(document.getElementById('removed-list'), state.removed, 'Put back', id => {
    state.removed.splice(state.removed.indexOf(id), 1); save();
  });
  listInto(document.getElementById('loved-list'), state.loved, 'Unlove', id => {
    state.loved.splice(state.loved.indexOf(id), 1); save();
  });
  document.getElementById('panel').classList.add('open');
}

document.getElementById('open-panel').addEventListener('click', openPanel);
document.getElementById('close-panel').addEventListener('click', () => {
  document.getElementById('panel').classList.remove('open');
  render(view, false);
});

document.getElementById('copy').addEventListener('click', async () => {
  const ta = document.getElementById('export');
  try {
    await navigator.clipboard.writeText(ta.value);
    document.getElementById('copied').textContent = 'Copied';
  } catch (e) {
    // Older iOS: select the text so you can tap Copy yourself.
    ta.focus(); ta.setSelectionRange(0, ta.value.length);
    document.getElementById('copied').textContent = 'Selected, tap Copy';
  }
  setTimeout(() => { document.getElementById('copied').textContent = ''; }, 2500);
});

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Clear every loved and removed vote on this device?')) return;
  state.loved = []; state.removed = []; save();
  openPanel(); render(state.pos, false);
});

// ---------------------------------------------------------------------------
// Boot: load the collection, advance the rotation if it is a new day.
// ---------------------------------------------------------------------------
function stampDate() {
  document.getElementById('date').textContent =
    new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}

function advanceIfNewDay() {
  const today = todayKey();
  if (state.day === null) {
    state.day = today;                    // very first run: start at the top of the file
  } else if (state.day !== today) {
    state.pos = nextLive(state.pos);      // one step per new day, so nothing gets skipped
    state.day = today;
  }
  if (isRemoved(state.pos)) state.pos = nextLive(state.pos);
  save();
}

fetch('incantations/incantations.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    all = data.incantations;
    if (!all.length) throw new Error('the collection is empty');
    if (state.pos >= all.length) state.pos = 0;   // list got shorter since last time
    advanceIfNewDay();
    stampDate();
    render(state.pos, false);
  })
  .catch(err => {
    document.getElementById('text').textContent = 'Could not load the collection.';
    document.getElementById('attribution').textContent = err.message +
      '. If that mentions CORS or "Failed to fetch", the page was opened as a file instead of being served.';
  });

// If the app was left open overnight, move on when you come back to it.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !all.length) return;
  if (state.day === todayKey()) return;
  advanceIfNewDay();
  stampDate();
  render(state.pos);
});

// ===========================================================================
// HISTORY. One entry per calendar day per activity, keyed by local date
// ('en-CA' => YYYY-MM-DD), so the record never grows heavier no matter how
// long the app gets used — a day that happens twice just bumps its counts.
// ===========================================================================
const History = (() => {
  const KEY = 'ritual.history.v1';
  const empty = () => ({ 'tai-chi': {}, posture: {}, breathing: {} });
  let data = empty();

  function load() {
    try { data = Object.assign(empty(), JSON.parse(localStorage.getItem(KEY)) || {}); }
    catch (e) { data = empty(); }
    if (data.gym) splitGym();
  }

  // Before tai chi and posture were tracked apart, both went into one 'gym'
  // bucket. Only finished routines were ever logged, at their full length
  // (tai chi 15 min, posture 9), so each day's sessions and minutes give back
  // exactly how many of each it held. Anything that doesn't fit counts as tai chi.
  function splitGym() {
    Object.entries(data.gym).forEach(([day, v]) => {
      let posture = (15 * v.sessions - v.minutes) / 6;
      if (!Number.isInteger(posture) || posture < 0 || posture > v.sessions) posture = 0;
      const add = (bucket, sessions, minutes) => {
        if (!sessions) return;
        const cur = bucket[day] || { sessions: 0, minutes: 0 };
        bucket[day] = { sessions: cur.sessions + sessions, minutes: +(cur.minutes + minutes).toFixed(1) };
      };
      add(data.posture, posture, posture * 9);
      add(data['tai-chi'], v.sessions - posture, v.minutes - posture * 9);
    });
    delete data.gym;
    save();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* private mode */ } }

  const dayKey = d => (d || new Date()).toLocaleDateString('en-CA');

  function bump(bucket, minutes) {
    const k = dayKey();
    const cur = bucket[k] || { sessions: 0, minutes: 0 };
    bucket[k] = { sessions: cur.sessions + 1, minutes: +(cur.minutes + minutes).toFixed(1) };
  }

  function logGym(routine, minutes) { load(); bump(data[routine] || (data[routine] = {}), minutes); save(); }
  function logBreathing(seconds) { load(); bump(data.breathing, seconds / 60); save(); }

  function streak(bucket) {
    let n = 0;
    const d = new Date();
    while (bucket[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function weekCount(bucket) {
    let n = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      if (bucket[dayKey(d)]) n++;
    }
    return n;
  }

  // Sessions and minutes for the month on screen only, so going back a month
  // shows that month's recap.
  function totals(bucket) {
    return monthDays(bucket).map(k => bucket[k]).reduce(
      (acc, v) => ({ sessions: acc.sessions + v.sessions, minutes: acc.minutes + v.minutes }),
      { sessions: 0, minutes: 0 }
    );
  }

  // The month currently shown in the calendar. Starts on today's month;
  // Prev/Next below only move within it, never past the current month.
  const viewDate = new Date();
  viewDate.setDate(1);

  // the bucket's day keys that fall in the month on screen
  const monthDays = bucket => Object.keys(bucket).filter(k => k.startsWith(dayKey(viewDate).slice(0, 8)));

  function isCurrentMonth() {
    const now = new Date();
    return viewDate.getFullYear() === now.getFullYear() && viewDate.getMonth() === now.getMonth();
  }

  function renderNav() {
    document.getElementById('hist-month-label').textContent =
      viewDate.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    document.getElementById('hist-next').disabled = isCurrentMonth();
  }

  function renderCalendar(gridEl, bucket, levelClass) {
    gridEl.innerHTML = '';
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const leadIn = new Date(year, month, 1).getDay(); // pad so day 1 lands on its real weekday
    const today = dayKey();
    for (let i = 0; i < leadIn; i++) {
      const pad = document.createElement('div');
      pad.className = 'cal-cell empty';
      gridEl.appendChild(pad);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dayKey(new Date(year, month, d));
      const entry = bucket[key];
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      if (key === today) cell.classList.add('today');
      if (entry) {
        cell.classList.add(levelClass + (entry.sessions > 1 || entry.minutes >= 10 ? '-2' : '-1'));
        cell.title = key + ' · ' + entry.sessions + (entry.sessions === 1 ? ' session' : ' sessions');
      } else {
        cell.title = key;
      }
      cell.textContent = d;
      gridEl.appendChild(cell);
    }
  }

  const fmtMinutes = m => Math.round(m * 10) / 10;

  // A past month has no "this week", so its first box counts the days practised
  // that month instead. The streak is about today, so it only shows on the current month.
  function renderStats(prefix, bucket) {
    const t = totals(bucket);
    const s = isCurrentMonth() ? streak(bucket) : 0;
    document.getElementById('hist-' + prefix + '-streak').textContent = s ? s + '-day streak' : '';
    document.getElementById('hist-' + prefix + '-week').textContent = isCurrentMonth() ? weekCount(bucket) : monthDays(bucket).length;
    document.getElementById('hist-' + prefix + '-week-label').textContent = isCurrentMonth() ? 'This week' : 'Days';
    document.getElementById('hist-' + prefix + '-total').textContent = t.sessions;
    document.getElementById('hist-' + prefix + '-minutes').textContent = fmtMinutes(t.minutes);
  }

  function render() {
    load();
    renderNav();
    renderStats('taichi', data['tai-chi']);
    renderStats('posture', data.posture);
    renderStats('breath', data.breathing);
    renderCalendar(document.getElementById('hist-taichi-grid'), data['tai-chi'], 'taichi');
    renderCalendar(document.getElementById('hist-posture-grid'), data.posture, 'posture');
    renderCalendar(document.getElementById('hist-breath-grid'), data.breathing, 'breath');
  }

  document.getElementById('hist-prev').addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() - 1);
    render();
  });
  document.getElementById('hist-next').addEventListener('click', () => {
    if (isCurrentMonth()) return;
    viewDate.setMonth(viewDate.getMonth() + 1);
    render();
  });

  return { logGym, logBreathing, render };
})();

// ===========================================================================
// GYM. A routine of timed movements, back to back: tai chi or posture, picked
// at the top and remembered on the device. The countdown is driven off a start
// timestamp rather than a tick counter, so it stays accurate even if the tab
// was backgrounded for a moment.
// ===========================================================================
const Gym = (() => {
  const ROUTINES = [
    { key: 'tai-chi', label: 'Tai chi', file: 'gym/tai-chi.json' },
    { key: 'posture', label: 'Posture', file: 'gym/posture.json' },
  ];
  const ROUTINE_KEY = 'app.gym.routine.v1';
  const routineCache = {};  // key -> movements, so switching back and forth doesn't refetch
  let routine = null;
  let movements = [];
  let loaded = false;
  let index = 0;
  let running = false;
  let startTs = null;       // Date.now() when the current movement's countdown last (re)started
  let pausedElapsed = 0;    // seconds already spent on the current movement when paused
  let tickId = null;
  let wakeLock = null;
  let warnedSecond = null;  // last whole second we already played the 3-2-1 warning tick for

  const els = {};
  function cacheEls() {
    ['gym-routines', 'gym-progress-label', 'gym-photo', 'gym-timer', 'gym-name', 'gym-cue', 'gym-segments', 'gym-next',
     'gym-back', 'gym-startpause', 'gym-skip', 'gym-restart', 'gym-done', 'gym-done-summary', 'gym-done-restart']
      .forEach(id => { els[id] = document.getElementById(id); });
  }

  function buildSegments() {
    els['gym-segments'].innerHTML = '';
    movements.forEach(() => {
      const seg = document.createElement('div');
      seg.className = 'seg';
      seg.innerHTML = '<div class="fill"></div>';
      els['gym-segments'].appendChild(seg);
    });
  }

  // One shared audio context, created and resumed inside the Start tap. iOS only
  // lets a page make sound from a context unlocked by a tap. A fresh context made
  // later from the timer stays suspended, so the old beeps were silent on the phone.
  // 'playback' (iOS 17+) also stops the ring/silent switch muting the beeps.
  let audioCtx = null;
  function unlockAudio() {
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state !== 'running') audioCtx.resume();
    } catch (e) { /* no audio available, silently skip */ }
  }

  function tone(freq, peak, length) {
    try {
      if (!audioCtx) return;
      if (audioCtx.state !== 'running') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.value = 0.0001;
      osc.connect(gain); gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      gain.gain.exponentialRampToValueAtTime(peak, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + length);
      osc.start(t); osc.stop(t + length + 0.05);
    } catch (e) { /* no audio available, silently skip */ }
  }

  // Long, high beep: change position now.
  function beep() {
    tone(1320, 0.5, 0.5);
    if (navigator.vibrate) navigator.vibrate(150);
  }

  // Short beep at 3, 2 and 1 seconds left, so you know to get ready for the
  // next move without having to watch the timer.
  function warnTick() {
    tone(880, 0.35, 0.15);
    if (navigator.vibrate) navigator.vibrate(40);
  }

  async function acquireWakeLock() {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* not supported, fine */ }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  function renderMovement() {
    const m = movements[index];
    els['gym-progress-label'].textContent = 'Move ' + (index + 1) + ' of ' + movements.length;
    els['gym-photo'].src = m.image;
    els['gym-photo'].alt = m.name;
    els['gym-name'].textContent = m.name;
    els['gym-cue'].textContent = m.cue || '';
    const next = movements[index + 1];
    els['gym-next'].textContent = next ? 'Next: ' + next.name : 'Last one';

    document.querySelectorAll('#gym-segments .seg').forEach((seg, i) => {
      seg.classList.toggle('done', i < index);
      seg.querySelector('.fill').style.width = i < index ? '100%' : '0%';
    });

    els['gym-timer'].textContent = m.seconds;
    els['gym-timer'].classList.remove('urgent');
    els['gym-startpause'].textContent = 'Start';
    els['gym-back'].disabled = index === 0;
  }

  function renderTick(remaining) {
    const m = movements[index];
    const secLeft = Math.max(0, Math.ceil(remaining));
    els['gym-timer'].textContent = secLeft;
    els['gym-timer'].classList.toggle('urgent', remaining <= 5);
    const frac = Math.min(1, Math.max(0, 1 - remaining / m.seconds));
    const fill = document.querySelectorAll('#gym-segments .seg')[index];
    if (fill) fill.querySelector('.fill').style.width = (frac * 100) + '%';

    if (secLeft >= 1 && secLeft <= 3 && secLeft !== warnedSecond) {
      warnedSecond = secLeft;
      warnTick();
    }
  }

  function tick() {
    if (!running) return;
    const m = movements[index];
    const elapsed = pausedElapsed + (Date.now() - startTs) / 1000;
    const remaining = m.seconds - elapsed;
    if (remaining <= 0) {
      advance();
    } else {
      renderTick(remaining);
    }
  }

  function start() {
    if (running) return;
    unlockAudio();
    running = true;
    startTs = Date.now();
    els['gym-startpause'].textContent = 'Pause';
    acquireWakeLock();
    if (!tickId) tickId = setInterval(tick, 200);
  }

  function pause() {
    if (!running) return;
    const m = movements[index];
    pausedElapsed = Math.min(m.seconds, pausedElapsed + (Date.now() - startTs) / 1000);
    running = false;
    els['gym-startpause'].textContent = 'Resume';
    releaseWakeLock();
  }

  function goTo(i, autorun) {
    index = Math.max(0, Math.min(movements.length - 1, i));
    pausedElapsed = 0;
    running = false;
    warnedSecond = null;
    els['gym-done'].classList.remove('open');
    renderMovement();
    if (autorun) start();
  }

  function advance() {
    beep();
    if (index >= movements.length - 1) { finish(); return; }
    goTo(index + 1, true);
  }

  function finish() {
    running = false;
    releaseWakeLock();
    const totalMin = movements.reduce((s, m) => s + m.seconds, 0) / 60;
    History.logGym(routine.key, totalMin);
    els['gym-done-summary'].textContent = movements.length + ' movements · ' + totalMin + ' minutes';
    els['gym-done'].classList.add('open');
    document.querySelectorAll('#gym-segments .seg').forEach(seg => {
      seg.classList.add('done');
      seg.querySelector('.fill').style.width = '100%';
    });
  }

  function renderRoutines() {
    els['gym-routines'].innerHTML = '';
    ROUTINES.forEach(r => {
      const btn = document.createElement('button');
      btn.textContent = r.label;
      btn.className = r === routine ? 'active' : '';
      btn.addEventListener('click', () => { if (r !== routine) selectRoutine(r); });
      els['gym-routines'].appendChild(btn);
    });
  }

  // Switching routine stops whatever was running and starts the new one from the top.
  function selectRoutine(r) {
    if (running) pause();
    releaseWakeLock();
    routine = r;
    try { localStorage.setItem(ROUTINE_KEY, r.key); } catch (e) { /* private mode */ }
    renderRoutines();
    const show = list => {
      if (routine !== r) return;  // another tap landed while this one was loading
      movements = list;
      buildSegments();
      goTo(0, false);
    };
    if (routineCache[r.key]) { show(routineCache[r.key]); return; }
    fetch(r.file)
      .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(data => { routineCache[r.key] = data.movements; show(data.movements); })
      .catch(err => {
        els['gym-name'].textContent = 'Could not load the movements.';
        els['gym-next'].textContent = err.message;
      });
  }

  function wireControls() {
    els['gym-startpause'].addEventListener('click', () => { running ? pause() : start(); });
    els['gym-skip'].addEventListener('click', () => {
      if (index >= movements.length - 1) { finish(); return; }
      goTo(index + 1, running);
    });
    els['gym-back'].addEventListener('click', () => goTo(index - 1, running));
    els['gym-restart'].addEventListener('click', () => goTo(0, false));
    els['gym-done-restart'].addEventListener('click', () => goTo(0, true));
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && running) acquireWakeLock();
    });
  }

  function boot() {
    if (loaded) return;
    loaded = true;
    cacheEls();
    wireControls();
    const saved = localStorage.getItem(ROUTINE_KEY);
    selectRoutine(ROUTINES.find(r => r.key === saved) || ROUTINES[0]);
  }

  return { boot: boot };
})();

// ===========================================================================
// BREATHING. A repeating inhale / hold / exhale / hold cycle. Any phase set
// to 0 seconds is skipped entirely — that's how 4-7-8 (no second hold) and
// coherent breathing (no holds at all) both fall out of the same 4-number
// model instead of needing special cases.
// ===========================================================================
const Breath = (() => {
  let PRESETS = []; // loaded from breathing/presets.json at boot
  const LABELS = ['Inhale', 'Hold', 'Exhale', 'Hold'];
  const PRE_SCALE = [0.62, 1.15, 1.15, 0.62]; // circle size the moment each phase begins
  const SECONDS_KEY = 'breath.seconds.v1';

  let seconds = [4, 4, 4, 4]; // box breathing, until presets.json loads (or a saved value is found)
  let phases = [];          // built from `seconds`, skipping any 0s
  let phaseIdx = 0;
  let cycles = 0;
  let running = false;
  let startTs = null;
  let pausedElapsed = 0;
  let tickId = null;
  let loaded = false;
  let loggedSeconds = 0;    // how much of the current session History already has, so leaving/returning to the tab never double-counts

  const els = {};
  function cacheEls() {
    ['breath-presets', 'breath-circle', 'breath-phase', 'breath-count',
     'breath-phasebar', 'breath-controls', 'breath-stats', 'breath-startpause', 'breath-reset']
      .forEach(id => { els[id] = document.getElementById(id); });
  }

  function save() {
    try { localStorage.setItem(SECONDS_KEY, JSON.stringify(seconds)); } catch (e) { /* private mode */ }
  }
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(SECONDS_KEY));
      if (Array.isArray(raw) && raw.length === 4) {
        seconds = raw.map(n => Math.max(0, Math.min(60, Number(n) || 0)));
        return true;
      }
    } catch (e) { /* first run */ }
    return false;
  }

  function buildPhases() {
    phases = [];
    seconds.forEach((s, i) => { if (s > 0) phases.push({ labelIndex: i, seconds: s }); });
    if (!phases.length) phases.push({ labelIndex: 0, seconds: 1 }); // guard: never let every phase be 0
  }

  function totalCycleSeconds() { return phases.reduce((s, p) => s + p.seconds, 0); }

  // Same shape as updateStats' `total`, but callable any time (not just mid-tick),
  // so a tab switch or app close can log whatever practice happened so far.
  function currentTotalSeconds() {
    const prior = phases.slice(0, phaseIdx).reduce((s, p) => s + p.seconds, 0);
    const elapsed = running ? pausedElapsed + (Date.now() - startTs) / 1000 : pausedElapsed;
    return cycles * totalCycleSeconds() + prior + elapsed;
  }

  // Logs only the *new* practice time since the last log, so pausing, switching
  // tabs and coming back never counts the same seconds twice. Ignores dregs
  // under 20s so an accidental tap-through doesn't clutter the history.
  function logSession() {
    const total = currentTotalSeconds();
    const delta = total - loggedSeconds;
    if (delta >= 20) History.logBreathing(delta);
    loggedSeconds = total;
  }

  function renderPresets() {
    els['breath-presets'].innerHTML = '';
    PRESETS.forEach(p => {
      const btn = document.createElement('button');
      btn.textContent = p.name;
      btn.className = arraysEqual(seconds, p.seconds) ? 'active' : '';
      btn.addEventListener('click', () => applySeconds(p.seconds.slice()));
      els['breath-presets'].appendChild(btn);
    });
  }

  function arraysEqual(a, b) { return a.length === b.length && a.every((v, i) => v === b[i]); }

  function renderControls() {
    els['breath-controls'].innerHTML = '';
    LABELS.forEach((label, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'breath-stepper';
      const lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = label;
      const row = document.createElement('div');
      row.className = 'row';
      const minus = document.createElement('button');
      minus.textContent = '–';
      minus.addEventListener('click', () => nudge(i, -1));
      const val = document.createElement('span');
      val.className = 'val' + (seconds[i] === 0 ? ' skip' : '');
      val.textContent = seconds[i] === 0 ? 'skip' : seconds[i] + 's';
      const plus = document.createElement('button');
      plus.textContent = '+';
      plus.addEventListener('click', () => nudge(i, 1));
      row.append(minus, val, plus);
      wrap.append(lab, row);
      els['breath-controls'].appendChild(wrap);
    });
  }

  function nudge(i, delta) {
    seconds[i] = Math.max(0, Math.min(60, seconds[i] + delta));
    applySeconds(seconds);
  }

  function renderPhasebar() {
    els['breath-phasebar'].innerHTML = '';
    phases.forEach(() => {
      const seg = document.createElement('div');
      seg.className = 'seg';
      seg.innerHTML = '<div class="fill"></div>';
      els['breath-phasebar'].appendChild(seg);
    });
  }

  function applySeconds(next) {
    seconds = next.map(n => Math.max(0, Math.min(60, n)));
    save();
    stop();
    buildPhases();
    phaseIdx = 0;
    cycles = 0;
    renderPresets();
    renderControls();
    renderPhasebar();
    enterPhase(true);
  }

  // CSS transitions run on wall-clock time once triggered — they don't know our
  // countdown is paused. So pausing has to read the circle's current interpolated
  // size and pin it there; resuming re-triggers a transition for the *remaining*
  // time only, from wherever it was pinned.
  function currentCircleScale() {
    const t = getComputedStyle(els['breath-circle']).transform;
    const m = t.match(/matrix\(([-0-9.eE]+),/);
    return m ? parseFloat(m[1]) : 0.62;
  }

  function freezeCircle() {
    const s = currentCircleScale();
    els['breath-circle'].style.transitionDuration = '0s';
    els['breath-circle'].style.transform = 'scale(' + s + ')';
  }

  function enterPhase(instant, durationOverride) {
    const p = phases[phaseIdx];
    els['breath-phase'].textContent = LABELS[p.labelIndex];
    els['breath-count'].textContent = Math.ceil(durationOverride != null ? durationOverride : p.seconds);
    const growsOrShrinks = p.labelIndex === 0 || p.labelIndex === 2;
    if (instant || !growsOrShrinks) {
      // Booting/resetting, or a hold phase: snap instantly, nothing to animate.
      els['breath-circle'].style.transitionDuration = '0s';
      els['breath-circle'].style.transform = 'scale(' + PRE_SCALE[p.labelIndex] + ')';
    } else {
      const dur = durationOverride != null ? durationOverride : p.seconds;
      els['breath-circle'].style.transitionDuration = Math.max(0.05, dur) + 's';
      els['breath-circle'].style.transform = 'scale(' + (p.labelIndex === 0 ? 1.15 : 0.62) + ')'; // 0=inhale grows, 2=exhale shrinks
    }
    document.querySelectorAll('#breath-phasebar .seg').forEach((seg, i) => {
      seg.classList.toggle('current', i === phaseIdx);
      seg.querySelector('.fill').style.width = i < phaseIdx ? '100%' : '0%';
    });
    updateStats(0);
  }

  function updateStats(currentElapsed) {
    const prior = phases.slice(0, phaseIdx).reduce((s, p) => s + p.seconds, 0);
    const total = cycles * totalCycleSeconds() + prior + currentElapsed;
    const mm = Math.floor(total / 60);
    const ss = Math.floor(total % 60);
    els['breath-stats'].textContent = cycles + (cycles === 1 ? ' cycle · ' : ' cycles · ') +
      mm + ':' + String(ss).padStart(2, '0');
  }

  function renderTick(remaining, elapsed) {
    const p = phases[phaseIdx];
    els['breath-count'].textContent = Math.max(0, Math.ceil(remaining));
    const seg = document.querySelectorAll('#breath-phasebar .seg')[phaseIdx];
    if (seg) seg.querySelector('.fill').style.width = (Math.min(1, elapsed / p.seconds) * 100) + '%';
    updateStats(elapsed);
  }

  function tick() {
    if (!running) return;
    const p = phases[phaseIdx];
    const elapsed = pausedElapsed + (Date.now() - startTs) / 1000;
    const remaining = p.seconds - elapsed;
    if (remaining <= 0) advancePhase(); else renderTick(remaining, elapsed);
  }

  function advancePhase() {
    phaseIdx++;
    if (phaseIdx >= phases.length) { phaseIdx = 0; cycles++; }
    pausedElapsed = 0;
    startTs = Date.now();
    enterPhase(false);
  }

  function start() {
    if (running) return;
    running = true;
    startTs = Date.now();
    const p = phases[phaseIdx];
    enterPhase(false, p.seconds - pausedElapsed);   // fresh phase, or resuming a frozen one — same call either way
    els['breath-startpause'].textContent = 'Pause';
    if (!tickId) tickId = setInterval(tick, 150);
  }

  function stop() {
    running = false;
    pausedElapsed = 0;
    startTs = null;
    els['breath-startpause'].textContent = 'Start';
  }

  function pause() {
    if (!running) return;
    const p = phases[phaseIdx];
    pausedElapsed = Math.min(p.seconds, pausedElapsed + (Date.now() - startTs) / 1000);
    running = false;
    freezeCircle();
    els['breath-startpause'].textContent = 'Resume';
  }

  function reset() {
    logSession();   // capture whatever was practiced before the counters clear
    stop();
    phaseIdx = 0;
    cycles = 0;
    loggedSeconds = 0;
    enterPhase(true);
  }

  function wireControls() {
    els['breath-startpause'].addEventListener('click', () => { running ? pause() : start(); });
    els['breath-reset'].addEventListener('click', reset);
  }

  function boot() {
    if (loaded) return;
    loaded = true;
    const hadStored = load();
    cacheEls();
    wireControls();
    fetch('breathing/presets.json')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => {
        PRESETS = data.presets;
        if (!hadStored) seconds = PRESETS[0].seconds.slice();
        buildPhases();
        renderPresets();
        renderControls();
        renderPhasebar();
        enterPhase(true);
      })
      .catch(err => {
        els['breath-phase'].textContent = 'Could not load presets';
        console.error(err);
      });
  }

  return { boot: boot, endSession: logSession };
})();

// ===========================================================================
// TABS. Wired up last, deliberately: it calls into Gym and Breath by name,
// so both of those need to already exist above this point in the file.
// Which tab is showing is remembered on the device, same as everything else
// here. More tabs later just need a button plus a matching .tab-panel.
// ===========================================================================
const TAB_KEY = 'app.tab.v1';

function showTab(name) {
  const leavingBreathing = document.getElementById('tab-breathing').classList.contains('active') && name !== 'breathing';
  if (leavingBreathing) Breath.endSession();   // banks whatever was practiced before switching away
  document.querySelectorAll('.tab-panel').forEach(el => el.classList.toggle('active', el.id === 'tab-' + name));
  document.querySelectorAll('#tabbar button').forEach(el => el.classList.toggle('active', el.id === 'tab-btn-' + name));
  try { localStorage.setItem(TAB_KEY, name); } catch (e) { /* private mode */ }
  if (name === 'gym') Gym.boot();
  if (name === 'breathing') Breath.boot();
  if (name === 'history') History.render();
}

// Closing the app (or the phone locking) while mid-session should still count.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' && document.getElementById('tab-breathing').classList.contains('active')) {
    Breath.endSession();
  }
});
window.addEventListener('beforeunload', () => {
  if (document.getElementById('tab-breathing').classList.contains('active')) Breath.endSession();
});

document.getElementById('tab-btn-incantation').addEventListener('click', () => showTab('incantation'));
document.getElementById('tab-btn-gym').addEventListener('click', () => showTab('gym'));
document.getElementById('tab-btn-breathing').addEventListener('click', () => showTab('breathing'));
document.getElementById('tab-btn-history').addEventListener('click', () => showTab('history'));

const startTabName = ['gym', 'breathing', 'history'].includes(localStorage.getItem(TAB_KEY)) ? localStorage.getItem(TAB_KEY) : 'incantation';
showTab(startTabName);
</script>
</body>
